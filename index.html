<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유재민(Jaemin Ryu)의 업무현황</title>
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="viewer.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <h1>유재민(Jaemin Ryu)의 업무현황</h1>
      <span class="published" id="published"></span>
      <span class="updated" id="updated" hidden></span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab is-on" data-view="projects">프로젝트</button>
      <button class="tab" data-view="calendar">캘린더</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <section class="stats" id="stats"></section>

  <!-- 프로젝트 (첫 화면) -->
  <section class="view" id="view-projects">
    <div id="project-cards"></div>
  </section>

  <!-- 캘린더 -->
  <section class="view" id="view-calendar" hidden>
    <div class="filters">
      <label class="check"><input type="checkbox" id="hide-done" checked> 완료 숨기기</label>
      <select id="filter-project"><option value="">전체 프로젝트</option></select>
    </div>
    <div class="cal-head">
      <button class="ghost" id="cal-prev" aria-label="이전 달">‹</button>
      <h2 id="cal-title"></h2>
      <button class="ghost" id="cal-next" aria-label="다음 달">›</button>
      <button class="ghost" id="cal-today">오늘</button>
    </div>
    <div class="legend">
      <span><i class="swatch swatch-proj"></i> 프로젝트 일정</span>
      <span><i class="swatch swatch-task"><i></i></i> 내 일정 (끝부분이 마감)</span>
      <span><i class="swatch swatch-approx"></i> 아직 미확정 (대략)</span>
    </div>
    <div class="cal-dow">
      <span>일</span><span>월</span><span>화</span><span>수</span>
      <span>목</span><span>금</span><span>토</span>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </section>

</main>

<div class="detail-backdrop" id="detail-backdrop" hidden>
  <aside class="detail" id="detail" role="dialog" aria-modal="true" aria-label="업무 상세"></aside>
</div>

<script src="shared/store.js"></script>
<script src="viewer.js"></script>
</body>
</html>
